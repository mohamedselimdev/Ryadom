<!DOCTYPE html>
<html lang="ru" data-title="meta.home">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Рядом</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/main.css">
  <script type="module" src="js/pages/home.js"></script>
</head>
<body>
  <div class="bubbles" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>

  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="/">
        <img src="images/icon.png" alt="" width="34" height="34">
        <span data-i18n="brand">Рядом</span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu" data-i18n-aria-label="nav.menu" aria-label="Открыть меню">
        <span></span><span></span><span></span>
      </button>
      <nav id="nav-menu" class="nav-menu">
        <a href="/#about" data-i18n="nav.about">О нас</a>
        <a href="/#plans" data-i18n="nav.plans">Тарифы</a>
        <a href="/booking" data-i18n="nav.specialists">Специалисты</a>
        <a href="/#library" data-i18n="nav.library">Библиотека</a>
        <a href="/login" data-guest data-i18n="nav.login">Вход</a>
        <a href="/booking#my-sessions" data-auth hidden data-i18n="nav.mySessions">Мои записи</a>
        <button type="button" class="link-btn" data-auth data-logout hidden data-i18n="nav.logout">Выйти</button>
        <select class="lang-select" data-lang-switch data-i18n-aria-label="lang.label" aria-label="Язык"></select>
        <a class="btn btn-primary" href="/chat" data-i18n="nav.chat">Чат с ИИ ➔</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1><span data-i18n="hero.title"></span> <span class="highlight" data-i18n="hero.titleHighlight"></span></h1>
        <p class="hero-lead" data-i18n="hero.lead"></p>
        <div class="choice-grid">
          <a class="choice-card" href="/booking">
            <img src="images/PROF.png" alt="" width="360" height="360">
            <div class="choice-card-body">
              <h2 data-i18n="hero.specialist.title"></h2>
              <p data-i18n="hero.specialist.text"></p>
            </div>
          </a>
          <a class="choice-card" href="/chat">
            <img src="images/aitherpy.png" alt="" width="360" height="360">
            <div class="choice-card-body">
              <h2 data-i18n="hero.ai.title"></h2>
              <p data-i18n="hero.ai.text"></p>
            </div>
          </a>
        </div>
      </div>
    </section>

    <section class="section" id="plans">
      <div class="container">
        <h2 class="section-title" data-i18n="plans.title"></h2>
        <p class="section-subtitle" data-i18n="plans.subtitle"></p>
        <div class="plans-grid">
        <article class="plan">
          <h3 data-i18n="plans.safety.name"></h3>
          <p class="plan-saving" data-i18n="plans.safety.saving"></p>
          <p class="plan-price" data-i18n="plans.safety.price"></p>
          <p class="plan-period" data-i18n="plans.safety.period"></p>
          <ul>
            <li data-i18n="plans.f.oneSession"></li>
            <li data-i18n="plans.f.duration"></li>
            <li data-i18n="plans.f.psychiatrist"></li>
            <li class="is-excluded" data-i18n="plans.f.cancel"></li>
            <li class="is-excluded" data-i18n="plans.f.messaging"></li>
          </ul>
          <a class="btn btn-primary btn-block" href="/payment?plan=safety" data-i18n="plans.cta">Начать сейчас</a>
        </article>
        <article class="plan is-featured">
          <span class="plan-badge" data-i18n="plans.popular">Популярный</span>
          <h3 data-i18n="plans.hope.name"></h3>
          <p class="plan-saving" data-i18n="plans.hope.saving"></p>
          <p class="plan-price" data-i18n="plans.hope.price"></p>
          <p class="plan-period" data-i18n="plans.hope.period"></p>
          <ul>
            <li data-i18n="plans.f.fourSessions"></li>
            <li data-i18n="plans.f.duration"></li>
            <li data-i18n="plans.f.psychiatrist"></li>
            <li data-i18n="plans.f.cancel"></li>
            <li class="is-excluded" data-i18n="plans.f.messaging"></li>
          </ul>
          <a class="btn btn-primary btn-block" href="/payment?plan=hope" data-i18n="plans.cta">Начать сейчас</a>
        </article>
        <article class="plan">
          <h3 data-i18n="plans.satisfaction.name"></h3>
          <p class="plan-saving" data-i18n="plans.satisfaction.saving"></p>
          <p class="plan-price" data-i18n="plans.satisfaction.price"></p>
          <p class="plan-period" data-i18n="plans.satisfaction.period"></p>
          <ul>
            <li data-i18n="plans.f.twelveSessions"></li>
            <li data-i18n="plans.f.duration"></li>
            <li data-i18n="plans.f.psychiatrist"></li>
            <li data-i18n="plans.f.cancel"></li>
            <li data-i18n="plans.f.messaging"></li>
          </ul>
          <a class="btn btn-primary btn-block" href="/payment?plan=satisfaction" data-i18n="plans.cta">Начать сейчас</a>
        </article>
        </div>
      </div>
    </section>

    <section class="section" id="about">
      <div class="container">
        <div class="about">
          <img class="about-image" src="images/icon.png" alt="" width="260" height="260">
          <div>
            <h2><span data-i18n="about.title"></span> <span data-i18n="brand"></span>!</h2>
            <p data-i18n="about.text"></p>
            <ul class="check-list">
              <li><i class="fa-solid fa-circle-check" aria-hidden="true"></i> <span data-i18n="about.item1"></span></li>
              <li><i class="fa-solid fa-circle-check" aria-hidden="true"></i> <span data-i18n="about.item2"></span></li>
              <li><i class="fa-solid fa-circle-check" aria-hidden="true"></i> <span data-i18n="about.item3"></span></li>
            </ul>
            <a class="btn btn-accent" href="/booking" data-i18n="about.cta"></a>
          </div>
        </div>
      </div>
    </section>

    <section class="section" id="library">
      <div class="container">
        <h2 class="section-title"><i class="fas fa-book-open" aria-hidden="true"></i> <span data-i18n="library.title"></span></h2>
        <p class="section-subtitle" data-i18n="library.subtitle"></p>
        <div class="library-tools">
          <input id="library-search" class="input search-input" type="search" data-i18n-placeholder="library.search" data-i18n-aria-label="library.search">
          <div class="chips" role="group">
            <button type="button" class="chip is-active" data-category="all" aria-pressed="true" data-i18n="library.all"></button>
            <button type="button" class="chip" data-category="articles" aria-pressed="false" data-i18n="library.articles"></button>
            <button type="button" class="chip" data-category="videos" aria-pressed="false" data-i18n="library.videos"></button>
            <button type="button" class="chip" data-category="files" aria-pressed="false" data-i18n="library.files"></button>
          </div>
        </div>
        <div class="library-grid">
        <article class="library-item" data-type="articles">
          <h3><i class="fas fa-file-lines" aria-hidden="true"></i> <span data-i18n="library.stress.title"></span></h3>
          <p data-i18n="library.stress.text"></p>
          <a href="https://gorzdrav.org/blog/kak-borotsja-so-stressom/" target="_blank" rel="noopener noreferrer" data-i18n="library.stress.link"></a>
        </article>
        <article class="library-item" data-type="videos">
          <h3><i class="fas fa-video" aria-hidden="true"></i> <span data-i18n="library.meditation.title"></span></h3>
          <p data-i18n="library.meditation.text"></p>
          <a href="https://www.youtube.com/watch?v=F0p2dl_XpMc" target="_blank" rel="noopener noreferrer" data-i18n="library.meditation.link"></a>
        </article>
        <article class="library-item" data-type="files">
          <h3><i class="fas fa-file-pdf" aria-hidden="true"></i> <span data-i18n="library.guide.title"></span></h3>
          <p data-i18n="library.guide.text"></p>
          <a href="https://interagencystandingcommittee.org/sites/default/files/migrated/2019-03/iasc_mhpss_guidelines_russian_0.pdf" target="_blank" rel="noopener noreferrer" data-i18n="library.guide.link"></a>
        </article>
        </div>
        <p id="library-empty" class="empty-state" hidden data-i18n="library.empty"></p>
      </div>
    </section>

    <section class="section" id="specialists">
      <div class="container">
        <h2 class="section-title" data-i18n="specialists.title"></h2>
        <p class="section-subtitle" data-i18n="specialists.subtitle"></p>
        <div class="carousel">
          <button type="button" class="carousel-btn prev" data-i18n-aria-label="specialists.prev"><i class="fas fa-chevron-left" aria-hidden="true"></i></button>
          <div id="specialists-track" class="carousel-track"></div>
          <button type="button" class="carousel-btn next" data-i18n-aria-label="specialists.next"><i class="fas fa-chevron-right" aria-hidden="true"></i></button>
        </div>
        <p class="center"><a class="btn btn-outline" href="/booking" data-i18n="specialists.all"></a></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <a class="brand" href="/">
          <img src="images/icon.png" alt="" width="34" height="34">
          <span data-i18n="brand">Рядом</span>
        </a>
        <div class="footer-links">
          <div>
            <a href="/" data-i18n="footer.home">Главная</a>
            <a href="/#about" data-i18n="footer.about">О нас</a>
            <a href="/#plans" data-i18n="footer.plans">Тарифы</a>
          </div>
          <div>
            <a href="/booking" data-i18n="footer.specialists">Найти специалиста</a>
            <a href="/chat" data-i18n="footer.chat">Чат поддержки</a>
            <a href="/login" data-i18n="footer.login">Личный кабинет</a>
          </div>
        </div>
        <div class="socials">
          <a href="#" aria-label="VK"><i class="fab fa-vk"></i></a>
          <a href="#" aria-label="Telegram"><i class="fab fa-telegram"></i></a>
          <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
          <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
        </div>
      </div>
      <p class="footer-bottom">© <span data-year>2025</span> <span data-i18n="brand">Рядом</span>. <span data-i18n="footer.rights">Все права защищены.</span></p>
    </div>
  </footer>
</body>
</html>
